[pytest]
# Tests for the src/python/* helper packages (tech-debt TEST-5).
#
# The packages under src/python/ are NOT importable packages: each one is a flat
# directory of modules that import each other by bare name (`from models import ...`),
# and RegionMapper and PorosityCalculation both define modules called `models`,
# `molar_masses`, `json_reader`, `json_writer` and `calculators`. They therefore
# cannot all sit on sys.path at once. tests/conftest.py loads each package in
# isolation and hands the module objects to the tests as fixtures; do not add
# these directories to `pythonpath` here.
testpaths = tests
python_files = test_*.py
addopts = -ra
